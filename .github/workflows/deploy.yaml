name: Deploy MultiDocker
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
      - run: docker build -t samuellaudev/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true samuellaudev/react-test npm test

      - run: docker build -t samuellaudev/multi-client ./client
      - run: docker build -t samuellaudev/multi-nginx ./nginx
      - run: docker build -t samuellaudev/multi-server ./server
      - run: docker build -t samuellaudev/multi-worker ./worker

      - run: docker push samuellaudev/multi-client
      - run: docker push samuellaudev/multi-nginx
      - run: docker push samuellaudev/multi-server
      - run: docker push samuellaudev/multi-worker

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: elasticbeanstalk-eu-west-2-441160708663
          region: eu-west-2
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip